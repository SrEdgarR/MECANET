pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 client_body_temp_path /tmp/body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 client_max_body_size 16k;
 server_tokens off;
 upstream api { server api1:3000; server api2:3000; }
 server {
  listen unix:/run/qa-ingress/web.sock ssl;
  server_name app.mecanet.test;
  ssl_certificate /run/tls/server.crt;
  ssl_certificate_key /run/tls/server.key;
  ssl_protocols TLSv1.3;
  root /app;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control no-store always;
  location /api/ {
   proxy_pass http://api;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Forwarded "";
   proxy_connect_timeout 2s;
   proxy_read_timeout 10s;
   proxy_next_upstream off;
  }
  location /assets/ { try_files $uri =404; }
  location = /saas.html { try_files $uri =404; }
  location = /login { try_files /saas.html =404; }
  location = /cuenta/empresas { try_files /saas.html =404; }
  location ~ ^/app/[0-9a-f-]+/catalogo$ { try_files /saas.html =404; }
  location = / { return 302 /login; }
  location / { try_files $uri =404; }
 }
}
