name: P1 verification

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, codex/integrate-p1-l1, codex/p1-l2, codex/p1-l3]

permissions:
  contents: read

concurrency:
  group: p1-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-contract:
    name: Local contracts, frontend and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      REAL_API: 'false'
      VITEST_REAL_API: 'false'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Use the approved Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Check the exact toolchain
        # The Linux Node distribution bundles a different npm version than local QA.
        # Install the approved exact version; keep the strict check below.
        run: |
          npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
          node --version
          npm --version
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.9.0"
          node scripts/ci/p1-l1.mjs provenance

      - name: Install locked backend dependencies without lifecycle scripts
        run: npm ci --prefix server/saas --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: node scripts/ci/p1-l1.mjs syntax

      - name: Run the explicit local contract suite
        run: node scripts/ci/p1-l1.mjs test

      - name: Check pure QA controller regressions
        run: python3 -X utf8 tests/qa/cp014/host-regression.py

      - name: Check the independent L3 controller without SSH or Docker
        run: |
          python3 -X utf8 tests/qa/cp019/host.test.py
          python3 -X utf8 tests/qa/cp019/target-host.test.py
          python3 -X utf8 tests/qa/cp019/target-lifecycle.test.py
          python3 -X utf8 tests/qa/cp019/target-variant-host.test.py
          python3 -X utf8 tests/qa/cp019/target-readiness-host.test.py
          python3 -X utf8 tests/qa/cp019/target-commit-host.test.py
          python3 -X utf8 tests/qa/cp019/target-http-host.test.py
          python3 -X utf8 tests/qa/cp019/target-probes-host.test.py
          python3 -X utf8 tests/qa/cp019/target-cold-host.test.py
          python3 -X utf8 tests/qa/cp019/controller.test.py
          python3 -X utf8 tests/qa/cp019/runner.test.py
          python3 -X utf8 tests/qa/cp019/resource-monitor.test.py
          python3 -X utf8 tests/qa/cp019/resource-sample.test.py
          python3 -X utf8 tests/qa/cp019/compose-compat.test.py
          python3 -X utf8 tests/qa/cp019/resume-state.test.py
          python3 -X utf8 tests/qa/cp019/resume.test.py
          python3 -X utf8 tests/qa/cp019/browser-config.test.py
          python3 -X utf8 tests/qa/cp019/tls_bundle.test.py
          python3 -X utf8 tests/qa/cp019/artifact.test.py

      - name: Verify the SaaS lane boundaries and tooling isolation negatives
        run: node --test scripts/ci/saas-toolchain.test.mjs scripts/ci/tooling-isolation.test.mjs

      - name: Verify locked SaaS lane, guarded tests, build and complete dependency audit
        run: node scripts/ci/saas-toolchain.mjs verify

      - name: Compare compiled SaaS assets with the frozen lot build provenance
        run: node scripts/ci/p1-l1.mjs assets

      - name: Audit backend runtime dependencies
        run: npm audit --prefix server/saas --omit=dev

      - name: Audit all backend dependencies as well
        if: ${{ !cancelled() }}
        run: npm audit --prefix server/saas
